plugins { id "com.android.application" }

android {
    namespace "space.are.store"
    compileSdk 36

    defaultConfig {
        applicationId "space.are.store"
        minSdk 24
        targetSdk 36
        // Version is derived from a controlled release source (CI properties or
        // the defaults committed here), never from an unversioned increment.
        versionCode Integer.parseInt(project.findProperty("areVersionCode") ?: "2")
        versionName project.findProperty("areVersionName") ?: "1.0.1"
    }

    // Release signing is fed exclusively from environment secrets supplied by a
    // protected GitHub environment. When the keystore path is missing the build
    // stays unsigned rather than producing a falsely-signed artifact.
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ARE_KEYSTORE_PATH")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ARE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ARE_KEY_ALIAS")
                keyPassword System.getenv("ARE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ARE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" &&
            ["kotlin-stdlib", "kotlin-stdlib-jdk7", "kotlin-stdlib-jdk8"].contains(details.requested.name)) {
            details.useVersion("1.8.22")
            details.because("Keep the AndroidX dependency graph on one Kotlin stdlib version.")
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
