plugins { id "com.android.application" }

android {
    namespace "space.are.store"
    compileSdk 36

    defaultConfig {
        applicationId "space.are.store"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" &&
            ["kotlin-stdlib", "kotlin-stdlib-jdk7", "kotlin-stdlib-jdk8"].contains(details.requested.name)) {
            details.useVersion("1.8.22")
            details.because("Keep the AndroidX dependency graph on one Kotlin stdlib version.")
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
