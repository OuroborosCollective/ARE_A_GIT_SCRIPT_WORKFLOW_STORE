name: ARE Store CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential-like source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' . --exclude-dir=.git; then
            echo "Credential-like material detected"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    needs: source-guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android debug build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
